# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json
site_name: Archcare
site_url: https://mydomain.org/mysite
repo_url: https://github.com/shayanmoosavi/archcare

theme:
  name: material
  icon:
    annotation: material/help-circle
  features:
    - content.footnote.tooltips
    - content.code.copy
    - content.code.annotate
    - navigation.instant
    - navigation.instant.progress
    - navigation.instant.prefetch
    - navigation.footer
  palette:
    # Palette toggle for light mode
    - scheme: default
      primary: teal
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode

    # Palette toggle for dark mode
    - scheme: slate
      primary: teal
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  font:
    text: Electrolize
    code: JetBrains Mono
nav:
  - Home: index.md
copyright: Copyright &copy; 2026 Shayan Moosavi

# Plugins and extensions
plugins:
  - autorefs
  - search

  - mkdocs-autoapi:
      autoapi_dir: src

  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
          options:
            modernize_annotations: true
            relative_crossrefs: true
            scoped_crossrefs: true
            separate_signature: true
            show_docstring_other_parameters: true
            show_signature_annotations: true
            show_signature_type_parameters: false
            docstring_section_style: spacy
            docstring_options:
              ignore_init_summary: true
            merge_init_into_class: true

  - git-revision-date-localized:
      enable_creation_date: true
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/shayanmoosavi
markdown_extensions:
  # Admonition support
  - admonition
  - pymdownx.details

  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

  - attr_list # HTML and CSS attributes
  - def_list
  - footnotes
  - md_in_html
  - pymdownx.betterem

  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      use_pygments: true

  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - toc:
      permalink: true
