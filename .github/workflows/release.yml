name: Release

on:
  push:
    tags:
      - "v*.*.*"       # Stable releases: v0.1.0, v1.2.3
      - "v*.*.*-rc*"   # Pre-releases: v0.1.0-rc1, v0.2.0-rc2

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    container: silkeh/clang
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Load cached Poetry installation
        id: cached-poetry
        uses: actions/cache@v6
        with:
          path: ~/.local  # the path depends on the OS
          key: poetry-0  # increment to reset cache

      - name: Install Poetry
        if: steps.cached-poetry.outputs.cache-hit != 'true'
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y upx

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: .venv
          key: release-venv-${{ runner.os }}-${{ hashFiles('poetry.lock', 'pyproject.toml') }}
          restore-keys: |
            release-venv-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
            release-venv-${{ runner.os }}-

      - name: Install dependencies
        run: poetry install --with dev,build --no-interaction

      - name: Verify tag matches project version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PROJECT_VERSION="$(poetry version --short)"
          if [ "$TAG_VERSION" != "$PROJECT_VERSION" ]; then
            echo "Tag v$TAG_VERSION does not match pyproject.toml version $PROJECT_VERSION"
            exit 1
          fi

      - name: Run full test suite
        run: poetry run pytest

      - name: Type check
        run: poetry run ty check

      - name: Record build environment
        run: |
          echo "=== Build toolchain ===" | tee build-info.txt
          "$CC" --version | head -1 | tee -a build-info.txt
          poetry run python --version | tee -a build-info.txt
          read -r NUITKA_VERSION < <(poetry run python -m nuitka --version | cat | head -1)
          echo "Nuitka: $NUITKA_VERSION" | tee -a build-info.txt

      - name: Build binary
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh

      - name: Verify binary
        run: |
          ls -lh dist/archcare
          file dist/archcare
          ./dist/archcare --help

      # === GPG SIGNING ===
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.PRIVATE_SIGNING_KEY }}
          passphrase: ${{ secrets.SIGNING_KEY_PASS }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Sign checksum
        run: |
          gpg --armor --detach-sign dist/archcare.sha256
          ls -lh dist/

      - name: Create GitHub Release (Draft)
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/archcare
            dist/archcare.sha256
            dist/archcare.sha256.asc
            build-info.txt
          generate_release_notes: true
          draft: true
          fail_on_unmatched_files: true
