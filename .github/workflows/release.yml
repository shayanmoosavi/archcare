name: Release

on:
  push:
    tags:
      - "v*.*.*"       # Stable releases: v0.1.0, v1.2.3
      - "v*.*.*-rc*"   # Pre-releases: v0.1.0-rc1, v0.2.0-rc2

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          install-groups: dev,build
          cache-key-prefix: release

      - name: Install clang-22
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y clang-22 lld-22

      - name: Install UPX 5.2.0
        run: |
          curl -L https://github.com/upx/upx/releases/download/v5.2.0/upx-5.2.0-amd64_linux.tar.xz -o upx.tar.xz
          tar -xf upx.tar.xz
          sudo install upx-5.2.0-amd64_linux/upx /usr/local/bin/upx
          rm -rf upx.tar.xz

      - name: Verify tag matches project version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          TAG_VERSION="${TAG_VERSION//-/}" # v0.1.0-rc1 -> 0.1.0rc1, matches Poetry's PEP 440 canonical output
          PROJECT_VERSION="$(poetry version --short)"
          if [ "$TAG_VERSION" != "$PROJECT_VERSION" ]; then
            echo "Tag v$TAG_VERSION does not match pyproject.toml version $PROJECT_VERSION"
            exit 1
          fi

      - name: Run full test suite
        run: poetry run pytest

      - name: Type check
        run: poetry run ty check

      - name: Record build environment
        env:
          CC: clang-22
          CXX: clang++-22
        run: |
          echo "=== Build toolchain ===" | tee build-info.txt
          "$CC" --version | head -1 | tee -a build-info.txt
          poetry run python --version | tee -a build-info.txt
          upx --version | head -3 | tee -a build-info.txt
          NUITKA_OUTPUT="$(poetry run python -m nuitka --version)"
          NUITKA_VERSION="$(head -1 <<< "$NUITKA_OUTPUT")"
          echo "Nuitka: $NUITKA_VERSION" | tee -a build-info.txt

      - name: Build binary
        env:
          CC: clang-22
          CXX: clang++-22
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh

      - name: Check binary size
        run: |
          SIZE_MB=$(du -m dist/archcare | cut -f1)
          echo "Binary size: ${SIZE_MB}MB"
          if [ "$SIZE_MB" -gt 45 ]; then
            echo "ERROR: Binary size ${SIZE_MB}MB exceeds 45MB threshold"
            exit 1
          fi

      - name: Verify binary
        run: |
          ls -lh dist/archcare
          file dist/archcare
          ./dist/archcare --help

      # === GPG SIGNING ===
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.PRIVATE_SIGNING_KEY }}
          passphrase: ${{ secrets.SIGNING_KEY_PASS }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Sign checksum
        run: |
          gpg --armor --detach-sign dist/archcare.sha256
          ls -lh dist/

      - name: Create GitHub Release (Draft)
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/archcare
            dist/archcare.sha256
            dist/archcare.sha256.asc
            build-info.txt
          generate_release_notes: true
          draft: true
          fail_on_unmatched_files: true
