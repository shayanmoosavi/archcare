name: Setup Environment
description: Common setup steps for Python/Poetry projects

inputs:
  python-version:
    description: Python version to install
    required: false
    default: "3.13"
  install-groups:
    description: Poetry dependency groups to install
    required: false
    default: dev
  cache-key-prefix:
    description: Prefix for cache keys
    required: false
    default: setup

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: Load cached Poetry installation
      id: cached-poetry
      uses: actions/cache@v6
      with:
        path: ~/.local # the path depends on the OS
        key: poetry-0 # increment to reset cache

    - name: Install Poetry
      if: steps.cached-poetry.outputs.cache-hit != 'true'
      uses: snok/install-poetry@v1
      with:
        virtualenvs-create: true
        virtualenvs-in-project: true

    - name: Cache virtualenv
      uses: actions/cache@v6
      with:
        path: .venv
        key: ${{ inputs.cache-key-prefix }}-venv-${{ runner.os }}-${{ hashFiles('poetry.lock', 'pyproject.toml') }}
        restore-keys: |
          ${{ inputs.cache-key-prefix }}-venv-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
          ${{ inputs.cache-key-prefix }}-venv-${{ runner.os }}-

    - name: Install dependencies
      shell: bash
      run: poetry install --with ${{ inputs.install-groups }} --no-interaction

    # Verify lock file is up to date (fails if pyproject.toml changed without lock)
    - name: Verify lock file
      shell: bash
      run: poetry check --lock
