name: Setup Environment
description: Common setup steps for Python projects

inputs:
  python-version:
    description: Python version to install
    required: false
    default: "3.13"
  install-groups:
    description: Extra dependency groups to install
    required: false
    default: dev
  cache-key-suffix:
    description: Suffix for cache keys
    required: false
    default: setup

runs:
  using: composite
  steps:
    - name: Setup UV
      uses: astral-sh/setup-uv@v9
      with:
        python-version: ${{ inputs.python-version }}
        enable-cache: true
        cache-python: true
        cache-suffix: ${{ inputs.cache-key-suffix }}

    - name: Install dependencies
      shell: bash
      run: uv sync --group ${{ inputs.install-groups }}

    # Verify lock file is up to date (fails if pyproject.toml changed without lock)
    - name: Verify lock file
      shell: bash
      run: uv lock --check
